name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Verify Lockfile Integrity
        run: pnpm install --frozen-lockfile

      - name: Verify Uniswap Pinning
        run: ./scripts/verify_uniswap_pin.sh

      - name: Build Contracts
        run: cd contracts && forge build

      - name: Test Contracts
        run: cd contracts && forge test -vv

      - name: Coverage
        run: |
          cd contracts
          forge coverage --report lcov --no-match-path 'test/invariant/*'
          cd ..
          ./scripts/check_coverage.sh contracts/lcov.info

      - name: Build Frontend
        run: |
          cd frontend
          pnpm build

      - name: Build Shared
        run: |
          cd shared
          pnpm build

      - name: Build Reactive
        run: cd reactive && forge build

      - name: Test Reactive
        run: cd reactive && forge test -vv

      - name: Verify Commit Requirements (Best Effort)
        continue-on-error: true
        run: ./scripts/verify_commits.sh

      - name: Verify Clean Tree (Best Effort)
        continue-on-error: true
        run: ./scripts/check_clean_tree.sh
